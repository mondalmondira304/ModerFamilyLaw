<template>
  <div class="slds-p-around_small">
    <div class="slds-grid slds-wrap slds-gutters">
      <div class="slds-col slds-size_1-of-1 heading">Military Service</div>

      <lightning-record-edit-form record-id={selectedRecordId} onsuccess={handleSuccess} object-api-name="Account" class="slds-col slds-size_1-of-1" density="comfy">
        <div class="slds-grid slds-wrap slds-gutters full-width">
          <!-- Column A -->
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
			<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
				<lightning-input-field field-name="Military_Branch__c" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
				<lightning-input-field field-name="Military_Rank__c" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
					</div>
				</div>

          <!-- Column B -->
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
			<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
				<lightning-input-field field-name="Military_Pay_Grade__c" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
				<lightning-input-field field-name="Currently_Service_Connected__c" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
					</div>
				</div>
			</div>
		</lightning-record-edit-form>
	</div>
  </div>
</template>
