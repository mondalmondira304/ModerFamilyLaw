<template>
	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
      	<div class="slds-col heading slds-size_1-of-1">Your Social Media</div>

		<lightning-record-edit-form record-id={selectedRecordId} onsuccess={handleSuccess} object-api-name="Account">

			<div class="slds-grid slds-wrap slds-gutters">
				<!-- Column A -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
			<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<lightning-input-field field-name="Instagram__c" data-field="Instagram__c" label="Instagram" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						<lightning-input-field field-name="Facebook__c" data-field="Facebook__c" label="Facebook" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
					</div>
				</div>
				<!-- Column B -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<lightning-input-field field-name="LinkedIn__c" data-field="LinkedIn__c" label="LinkedIn" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						<lightning-input-field field-name="Twitter__c" data-field="Twitter__c" label="X/Twitter" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
					</div>
				</div>
			</div>

		</lightning-record-edit-form>
	</div>

	<template if:true={showServiceSpinner}>
		<lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
	</template>

	<div class="slds-p-around_large slds-col slds-grid slds-grid_align-center slds-wrap slds-size_12-of-12">
		<template if:true={manageNextANDSAVEButtons}>
			<button class="next-button nextBtnPadding" onclick={handleSubmitVitalSection}>SUBMIT ALL VITALS <span class="arrow nextBtnArrow">→</span></button>
		</template>
	</div>

	<template if:true={isModalOpen}>
		<section class="slds-modal slds-fade-in-open slide-in-top">
			<div class="slds-modal__container fitIcon">
				<div>
					<lightning-icon icon-name="utility:close" size="small" onclick={closeModal} class="slds-float_right icon-color"></lightning-icon>
				</div>
				<div class="popupbackground">
					<div><img src={vitalLogoImg} alt="image sample" class="logo" /></div>
				</div>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>
</template>
