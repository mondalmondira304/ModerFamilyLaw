<template>
	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
		<template if:false={addEmployment}>
			<div class="slds-col heading slds-size_1-of-1">Current Employer</div>
		</template>
		<template if:true={addCurrentEmployment}>
			<div class="slds-col heading slds-size_1-of-1">{addcurrentEmploymentLabel} Current Employment</div>
			<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-grid slds-grid_align-center subheading">Employer Information</div>
		</template>
		<template if:true={addCurrentEmploymentIncome}>
			<div class="slds-col heading slds-size_1-of-1">{addcurrentEmploymentLabel} Current Employment Income</div>
			<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-grid slds-grid_align-center subheading">Current Employer</div>
		</template>
		<template if:true={addCurrentEmployer}>
			<div class="slds-col heading slds-size_1-of-1">{addcurrentEmploymentLabel} Current Employment</div>
			<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-grid slds-grid_align-center subheading">Current Employer</div>
		</template>
		<template if:false={addEmployment}>
			<div class="slds-p-top_large slds-col slds-wrap slds-grid slds-size_1-of-1 slds-grid_align-center">
				<div class="slds-col slds-size_12-of-12 slds-p-horizontal_small slds-p-vertical_medium alignAddButton">
					<button class="custom-button" onclick={handleAddEmployment}>
						<span class="button-text">Add</span>
						<lightning-icon icon-name="utility:add" size="xx-small" class="icon-style"></lightning-icon>
					</button>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-vertical_medium custom-table-container">
					<table class="custom-table">
						<thead>
							<tr>
								<th>Employment Name</th>
								<th>Job Title</th>
								<th>Start</th>
							</tr>
						</thead>
						<tbody>
							<template for:each={currentData} for:item="row" for:index="index">
								<tr key={row.id}>
									<td>
										<span class="rowName" onclick={handleEmploymentCellClick} data-id={row.Id} data-field="Employment__c">{row.Name}<lightning-icon icon-name="utility:edit" size="xx-small" class="edit-icon"></lightning-icon></span>
									</td>
									<td>{row.Job_Title__c}</td>
									<td>{row.Date_of_Hire__c}</td>
									<td><span data-id={row.Id} data-field="Employment__c" data-index={index} onclick={handleDeleteChild}><lightning-icon icon-name="utility:delete" size="x-small" class="edit-icon"></lightning-icon></span></td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
			</div>
		</template>
			<lightning-record-edit-form record-id={selectedRecordId} object-api-name="Employment__c" onsuccess={handleSuccess}>
				<template lwc:if={addCurrentEmployment}>

					<div class="slds-grid slds-wrap slds-gutters">
						<!-- Column A -->
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">						
							<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
								<label class="labelCSS">Employment Name</label>
								<lightning-input-field field-name="Name" data-field="Name"  required variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
							</div>
							<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
								<label class="labelCSS">Employer</label>
								<lightning-input-field field-name="Employer__c" data-field="Employer__c" required variant="label-hidden" class="custom-input icon-color"  onchange={handleOnChange} autocomplete="off"></lightning-input-field>
							</div>
							<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
								<label class="labelCSS">Employer Street Address</label>
								<lightning-input-field field-name="Employer_Address__c" data-field="Employer_Address__c" variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
							</div>
							<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
								<lightning-input-field field-name="Related_To_Text__c" data-field="Related_To_Text__c"  variant="label-stacked"   class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
							</div>
							<lightning-input-field field-name="Related_Matter__c" disabled="true" variant="label-hidden" class="slds-hidden" value={childMatterActivity} autocomplete="off" ></lightning-input-field>
						</div>
						<!-- Column B -->
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Employer Phone</label>
									<lightning-input-field field-name="Employer_Phone__c" data-field="Employer_Phone__c"  variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off"></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Employer Website</label>
									<lightning-input-field field-name="Employer_Website__c" data-field="Employer_Website__c" variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off"></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
									<label class="labelCSS">Date of Hire</label>
									<lightning-icon icon-name="utility:event" size="x-small" class="icon-color helpTextMargin"></lightning-icon>
									<lightning-input-field field-name="Date_of_Hire__c" data-field="Date_of_Hire__c"  variant="label-hidden" class="custom-input icon-color" required onchange={handleOnChange}  autocomplete="off"></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
									<label class="labelCSS">Job Title</label>
									<lightning-input-field field-name="Job_Title__c" data-field="Job_Title__c" type="date" required variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off"></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Hours Per Week</label>
									<lightning-input-field field-name="Hours_Weekly__c" data-field="Hours_Weekly__c" variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off"></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Self_Employed_at_this_Job__c" data-field="Self_Employed_at_this_Job__c" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
								</div>
							</div>
						</div>						
					</div>
					
				</template>

				<template lwc:elseif={visibleSelfEmployment}>
					<div class="slds-col heading slds-size_1-of-1">{addcurrentEmploymentLabel} Current Self Employment</div>
					<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-grid slds-grid_align-center subheading">Employer Information</div>
					
					<div class="slds-grid slds-wrap slds-gutters">
						<!-- Column A -->
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Self_Employment_Business_Name__c" data-field="Self_Employment_Business_Name__c" variant="label-stacked" required class="custom-input icon-color"  onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Business_Ownership__c" data-field="Business_Ownership__c" variant="label-stacked" onchange={handleOnChange}  class="custom-input icon-color" style="margin-bottom: 0.5rem;" autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Owner_Role__c" data-field="Owner_Role__c" variant="label-stacked"  class="custom-input icon-color" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Self_Employment_Business_Type__c" data-field="Self_Employment_Business_Type__c" variant="label-stacked"  class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Self_employment_number_of_years__c" data-field="Self_employment_number_of_years__c" variant="label-stacked"  class="custom-input icon-color" onchange={handleOnChange} requiredautocomplete="off" ></lightning-input-field>
								</div>
								<lightning-input-field field-name="Related_Matter__c" disabled="true" variant="label-hidden" class="slds-hidden" value={childMatterActivity} autocomplete="off" ></lightning-input-field>								
							</div>
						</div>
						<!-- Column B -->
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Self_Employment_Income_Last_Month__c" data-field="Self_Employment_Income_Last_Month__c"  class="custom-input icon-color"  variant="label-stacked" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Self_Employment_Income_Monthly_Average__c" data-field="Self_Employment_Income_Monthly_Average__c"  class="custom-input icon-color" variant="label-stacked"  onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Gross_Overtime_Last_Month__c" data-field="Gross_Overtime_Last_Month__c"  class="custom-input icon-color" variant="label-stacked"  onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Gross_Overtime_Monthly_Average__c" data-field="Gross_Overtime_Monthly_Average__c"  class="custom-input icon-color" variant="label-stacked"  onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Commissions_or_Bonuses_last_month__c" data-field="Commissions_or_Bonuses_last_month__c"  class="custom-input icon-color" variant="label-stacked"  onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Commissions_or_Bonuses_Monthly_Average__c" data-field="Commissions_or_Bonuses_Monthly_Average__c"   class="custom-input icon-color" variant="label-stacked" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
							</div>
						</div>
					</div>
				</template>

				<template lwc:elseif={addCurrentEmploymentIncome}>

					<div class="slds-grid slds-wrap slds-gutters">
						<!-- Column A -->
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Gross_Salary_Last_Month__c" data-field="Gross_Salary_Last_Month__c" variant="label-stacked"  class="custom-input icon-color" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Pay_Cycle__c" data-field="Pay_Cycle__c"  variant="label-stacked" class="custom-input" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Hourly__c" data-field="Hourly__c" variant="label-stacked"  class="custom-input" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Commissions or Bonuses Last Month</label>
									<lightning-input-field field-name="Commissions_or_Bonuses_last_month__c" data-field="Commissions_or_Bonuses_last_month__c"  variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange} requiredautocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Commissions_or_Bonuses_Monthly_Average__c" data-field="Commissions_or_Bonuses_Monthly_Average__c"  variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_6-of-12 slds-p-horizontal_small slds-p-top_medium">
									<lightning-input-field field-name="Pay_Rate__c" data-field="Pay_Rate__c"  variant="label-stacked"  class="custom-input icon-color" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_6-of-12 slds-p-horizontal_small slds-p-top_medium">
									<lightning-input-field field-name="Annual_Income__c" data-field="Annual_Income__c"  variant="label-stacked"  class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>								
							</div>
						</div>
						<!-- Column B -->
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Gross Salary Monthly Average</label>
									<lightning-input-field field-name="Gross_salary_monthly_average__c" data-field="Gross_salary_monthly_average__c"  variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Gross_Overtime_Last_Month__c" data-field="Gross_Overtime_Last_Month__c"  variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<lightning-input-field field-name="Gross_Overtime_Monthly_Average__c" data-field="Gross_Overtime_Monthly_Average__c"  variant="label-stacked"  class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="upload-container slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
									<div class="upload-header">
										<span>UPLOAD DOCUMENTS</span>
										<lightning-helptext content="Please upload the required documents." class="icon-color"></lightning-helptext>
									</div>
									<p class="upload-instructions">Please upload the following files:</p>
									<ul class="file-list">
										<li><strong>Three Months of Paystubs</strong></li>
									</ul>
									<div class="upload-box">
											<p class="file-types">JPG, PDF, CSV, DOCX, XLSX</p>
										<lightning-file-upload
											name="fileUploader"
											accept={acceptedFormats}
											record-id={selectedRecordId}
											multiple
											onuploadfinished={handleUploadFinished}
										>
										</lightning-file-upload>
										</div>
									<template if:true={uploadedCurrentEmploymentFile}>
										<template for:each={uploadedCurrentEmploymentFile} for:item="file" for:index="index">
											<lightning-pill
												label={file.name}
												name={index} 
												key={file.id}
												data-id={file.id}
												data-field="uploadFile"
												onremove={handleFileDelete}>
											</lightning-pill>
										</template>
									</template>
								</div>
							</div>
						</div>
					</div>
				</template>
				<template lwc:elseif={addCurrentEmployer}>
					<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-grid subheading">Mandatory Monthly Deductions</div>
					
					<div class="slds-grid slds-wrap slds-gutters">
						<!-- Column A -->
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Federal Income Tax (Monthly)</label>
									<lightning-input-field field-name="Federal_Income_Tax__c" data-field="Federal_Income_Tax__c"  variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} requiredautocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Deductions Medical</label>
									<lightning-input-field field-name="Deductions_Medical__c" data-field="Deductions_Medical__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Medicare Tax</label>
									<lightning-input-field field-name="Medicare_Tax__c" data-field="Medicare_Tax__c"  variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Stocks/Bonds Deducted</label>
									<lightning-input-field field-name="Stocks_Bonds_Deductions__c" data-field="Stocks_Bonds_Deductions__c"  variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">PERA/Civil Service</label>
									<lightning-input-field field-name="PERA_Civil_Service__c" data-field="PERA_Civil_Service__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} requiredautocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Social Security Tax</label>
									<lightning-input-field field-name="Social_Security_Tax__c" data-field="Social_Security_Tax__c"  variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Deductions Job Related</label>
									<lightning-input-field field-name="Deductions_Job_Related__c" data-field="Deductions_Job_Related__c"  variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
							</div>
						</div>
						<!-- Column B -->
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
								<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
									<label class="labelCSS">State Tax</label>
									<lightning-input-field field-name="State_Tax__c" data-field="State_Tax__c" variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange} autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Deductions for Child Support</label>
									<lightning-input-field field-name="Deductions_Child_Support__c" data-field="Deductions_Child_Support__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off" ></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
									<label class="labelCSS">Deductions for Spousal Support</label>
									<lightning-input-field field-name="Deductions_Spousal_Support__c" data-field="Deductions_Spousal_Support__c"  variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange}  autocomplete="off"></lightning-input-field>
								</div>
								<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
