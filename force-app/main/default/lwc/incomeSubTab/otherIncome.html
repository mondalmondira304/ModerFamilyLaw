<template>
	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
		<div class="slds-col heading slds-size_1-of-1">Other Income</div>

		<lightning-record-edit-form record-id={otherIncomeRecordId} object-api-name="Other_Income__c"  onsuccess={handleSuccess}>

			<div class="slds-grid slds-wrap slds-gutters">
				<!-- Column A -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">						
						<div class="slds-size_1-of-1 slds-m-bottom_small">
							<label class="labelCSS">Other Income Name</label>
							<lightning-input-field field-name="Name" data-field="Name" variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-size_1-of-1 slds-m-bottom_small">
							<label class="labelCSS">Monthly Income</label>
							<lightning-input-field field-name="Monthly_Income__c" data-field="Monthly_Income__c" variant="label-hidden"  class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
					</div>
				</div>
				<!-- Column B -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<div class="slds-size_1-of-1 slds-m-bottom_small">
							<label class="labelCSS">Type of Income</label>
							<lightning-input-field field-name="Type_of_Income__c" data-field="Type_of_Income__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-size_1-of-1 slds-m-bottom_small">
							<label class="labelCSS">Annual Income</label>
							<lightning-input-field field-name="Annual_Income__c" data-field="Annual_Income__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>				
					</div>
				</div>
			</div>

		</lightning-record-edit-form>

		 <div class="slds-col slds-size_1-of-1 controls slds-grid slds-grid_align-center slds-p-top_medium">
			<button class="next-button nextBtnPadding" onclick={handleSave}>SAVE & CONTINUE
				<span class="arrow nextBtnArrow">→</span>
			</button>
		</div>
    </div>
</template>
