<template>
	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
		<div class="slds-col heading slds-size_1-of-1">Support Income</div>

		<lightning-record-edit-form record-id={otherIncomeRecordId} object-api-name="Other_Income__c" density="comfy" onsuccess={handleSuccess}>

			<div class="slds-grid slds-wrap slds-gutters slds-size_1-of-1">
				<!-- Column A -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">					
						<div class="slds-size_1-of-1">
							<label class="labelCSS">Spousal Support from Others Last Month</label>
							<lightning-input-field field-name="Spousal_Support_from_Others1Month__c" data-field="Spousal_Support_from_Others1Month__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-size_1-of-1">
							<label class="labelCSS">Average Spousal Support from Others</label>
							<lightning-input-field field-name="Average_Spousal_Support_from_Others__c" data-field="Average_Spousal_Support_from_Others__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-size_1-of-1">
							<label class="labelCSS">Partner Support from Others Last Month</label>
							<lightning-input-field field-name="Partner_Support_from_Others1month__c" data-field="Partner_Support_from_Others1month__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-size_1-of-1">
							<label class="labelCSS">Average Partner Support from Others</label>
							<lightning-input-field field-name="Average_Partner_Support__c" data-field="Average_Partner_Support__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>

					</div>
				</div>
				<!-- Column B -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<div class="slds-size_1-of-1">
							<label class="labelCSS">Support Received for Other Child(ren)</label>
							<lightning-input-field field-name="Support_rec_d_for_other_child_Monthly__c" data-field="Support_rec_d_for_other_child_Monthly__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-size_1-of-1">
							<label class="labelCSS">Child Support from Other</label>
							<lightning-input-field field-name="Child_Support_from_Other__c" data-field="Child_Support_from_Other__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-size_1-of-1">
							<label class="labelCSS">Income from the Children</label>
							<lightning-input-field field-name="Child_Income__c" data-field="Child_Income__c" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>					
					</div>
				</div>
			</div>

		</lightning-record-edit-form>

		 <div class="slds-col slds-size_1-of-1 controls slds-grid slds-grid_align-center slds-p-top_medium">
			<button class="next-button nextBtnPadding" onclick={handleSave}>SAVE & CONTINUE
				<span class="arrow nextBtnArrow">→</span>
			</button>
		</div>
	</div>
</template>
