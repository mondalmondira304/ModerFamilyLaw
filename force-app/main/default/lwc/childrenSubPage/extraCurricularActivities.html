<template>
	<div class="slds-p-around_large slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
		<template lwc:if={addActivity}>
			<div class="slds-col heading slds-size_1-of-1">Extracurricular Activities</div>
			<div class="slds-p-bottom_large slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1 subheading">{childName}</div>
			<div class="slds-col slds-wrap slds-grid slds-size_1-of-1 slds-grid_align-center">
				<div class="slds-col slds-size_12-of-12 slds-p-horizontal_small slds-p-vertical_medium">
					<table class="custom-table">
						<thead>
							<tr>
								<th>Activity Name</th>
								<th>Cost</th>
								<th>Who Pays</th>
								<th>Schedule</th>
								<th>
									<div class="slds-float_right">
										<button class="custom-button" onclick={handleAddActivity}>
											<span class="button-text">Add</span>
											<lightning-icon icon-name="utility:add" size="xx-small" class="icon-style"></lightning-icon>
										</button>
									</div>
								</th>
							</tr>
						</thead>
						<tbody>
							<template for:each={extraCurricularData} for:item="row">
								<tr key={row.id}>
									<td>
										<span class="rowName" onclick={handleActivityClick} data-id={row.Id} data-field={row.Name}>{row.Name}<lightning-icon icon-name="utility:edit" size="xx-small" class="edit-icon"></lightning-icon></span>
									</td>
									<td>{row.Cost__c}</td>
									<td>{row.whoPaysName}</td>
									<td>{row.test}</td>
									<td><span data-id={row.Id} data-field="Activities__c" onclick={handleDeleteChild}><lightning-icon icon-name="utility:delete" size="x-small" class="edit-icon"></lightning-icon></span></td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
			</div>
		</template>
		<template lwc:else>
			<lightning-record-edit-form record-id={childActivity} object-api-name="Activities__c"  onsuccess={handleSuccess}>
				<div class="slds-col heading slds-size_1-of-1">{addExtraCurricular} Extracurricular Activities</div>
				<div class="slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1 subheading">{childName}</div>
				<div class="slds-p-horizonal_large slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-2 slds-grid_align-center slds-p-top_large">
						<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
							<lightning-input-field field-name="Name" data-field="Name" label="Activity Name" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div> 
						<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
							<lightning-input-field field-name="Weekly_Schedule__c" data-field="Weekly_Schedule__c" label="Weekly Schedulee" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
							<lightning-input-field field-name="Cost__c" data-field="Cost__c" label="Monthly Cost of Activity" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
							<lightning-input-field field-name="Child_Name__c" data-field="Child_Name__c" label = "Child Name" variant="label-stacked" class="custom-input icon-color" value={recordId} disabled="true" read-only="true" ></lightning-input-field>
						</div>
					</div>
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-2 slds-grid_align-center slds-p-top_large">
						<div class="slds-col slds-size_10-of-12 slds-p-horizontal_small slds-p-top_medium">
							<lightning-input-field field-name="Activity_Type__c" data-field="Activity_Type__c" label="Activity Type" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_10-of-12 slds-p-horizontal_small slds-p-top_medium">
							<lightning-input-field field-name="Activity_Provider__c" data-field="Activity_Provider__c" label="Activity Provider" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_10-of-12 slds-p-horizontal_small slds-p-top_medium">
							<lightning-input-field field-name="Who_Pays_for_Activity_Text__c" data-field="Who_Pays_for_Activity_Text__c" label="Who Pays for activity" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>							
						</div>
					</div>
				</div>
				<lightning-input-field field-name="Matter__c" disabled="true" variant="label-hidden" class="slds-hidden" value={childMatterActivity} ></lightning-input-field>	
			</lightning-record-edit-form>
		</template>
	</div>
	<div class="slds-col slds-size_1-of-1 controls slds-grid slds-grid_align-center">
		<template if:true={addActivity}>
			<button class="next-button previousBtnPadding" onclick={handleCancelChild}>
			<span class="arrow previousBtnArrow">←</span>
			BACK
			</button>
			<button class="next-button nextBtnPadding" onclick={handleSaveChild}>DONE WITH ACTIVITIES
				<span class="arrow nextBtnArrow">→</span>
			</button>
		</template>
		<template if:false={addActivity}>
			<button class="cancel-button" onclick={handleCancelActivity}>
			CANCEL
			</button>
			<button class="next-button nextBtnPadding" onclick={handleSaveActivity}>ADD ACTIVITY
				<span class="arrow nextBtnArrow">→</span>
			</button>
		</template>
	</div>
</template>
