<template>
	<lightning-record-edit-form object-api-name="Children__c" record-id={selectedChildRecordId} density="comfy" onsuccess={handleSuccess}   >
		<template lwc:if={addChild}>
			<div class="slds-col heading headingPadding slds-size_1-of-1">{addLabel} a Child from</div>
			<div class="slds-col heading slds-size_1-of-1">Your Relationship with Opposing Party</div>

			<div class="slds-grid slds-wrap slds-gutters slds-size_1-of-1 slds-p-top_medium slds-p-bottom_medium">
				<!-- Column A -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<div class="slds-size_1-of-1">
							<label class="labelCSS"><abbr class="slds-required" part="required" lwc-enmikoh2qu=""
									title="required">*</abbr>Child’s Name</label>
							<lightning-input-field field-name="Name" data-field="Name" label="Child's First Name" variant="label-hidden" class="custom-input" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>

						<div class="slds-grid slds-wrap slds-gutters slds-p-top_medium slds-size_1-of-1">
							<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
								<label class="labelCSS"> Gender<abbr class="slds-required" part="required" title="required">*</abbr>
								</label>
								<lightning-input-field field-name="Gender__c" data-field="Gender__c" label="Gender" variant="label-hidden" class="custom-input" onchange={handleOnChange} required autocomplete="off"> </lightning-input-field>
							</div>

							<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
								<label class="labelCSS">Race</label>
								<lightning-input-field field-name="Race__c" data-field="Race__c" label="Race" variant="label-hidden" class="custom-input" onchange={handleOnChange}> autocomplete="off" </lightning-input-field>
							</div>
						</div>

						<div class="slds-p-top_medium slds-size_1-of-1">
							<lightning-input-field field-name="Social_Security_Number__c" data-field="Social_Security_Number__c" label="Social Security Number" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>

						<div class="slds-p-top_medium slds-size_1-of-1">
							<lightning-input-field field-name="Date_of_Birth__c" data-field="Date_of_Birth__c" label="Date Of Birth" class="custom-input icon-color" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>

					</div>

				</div>
				<!-- Column B -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<div class="slds-size_1-of-1">
							<label class="labelCSS"><abbr class="slds-required" part="required" lwc-enmikoh2qu="" title="required">*</abbr>Current Street Address</label>
							<lightning-input-field field-name="Street__c" data-field="Street__c" label="Current Street Address" variant="label-hidden" class="custom-input" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-p-top_medium slds-size_1-of-1">
							<label class="labelCSS">City<abbr class="slds-required" part="required" lwc-enmikoh2qu="" title="required">*</abbr></label>
							<lightning-input-field field-name="City__c" data-field="City__c" label="City" variant="label-hidden" class="custom-input" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-p-top_medium slds-size_1-of-1">
							<lightning-input-field field-name="State__c" data-field="State__c" label="State" class="custom-input" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-p-top_medium slds-size_1-of-1">
							<lightning-input-field field-name="Time_in_Jurisdiction__c" data-field="Time_in_Jurisdiction__c" label="Length of Residence in Current State" class="custom-input icon-color" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
						</div>

					</div>

				</div>

			</div>
		</template>

		<template lwc:if={addChildSubTab1}>

			<div class="slds-col heading slds-size_1-of-1">Your Relationship with Opposing Party</div>

						<label class="labelCSS">Parent/Guardian Full Name (Client)</label>

					</div>
				</div>
				<div class="slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
					<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
						<lightning-input-field field-name="If_Other__c" data-field="If_Other__c" label="Parent/Guardian (Client)" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
					</div>
				</div>
				<div class="slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
					<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
						<lightning-input-field field-name="Child_Resides_With__c" data-field="Child_Resides_With__c" label="Child Resides with" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} required autocomplete="off"></lightning-input-field>
					</div>
				</div>
				<div class="slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">

					</div>
					<div class="slds-col slds-size_1-of-2 slds-p-horizontal_small slds-p-top_medium">
						<label class="labelCSS">Dependent Child’s Monthly Gross</label>
						<lightning-input-field field-name="Dependent_Children_s_monthly_gross__c" data-field="Dependent_Children_s_monthly_gross__c" label="Dependent Child Monthly Gross" variant="label-hidden" class="custom-input" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
					</div>
				</div>
			</div>
		</template>

		<template lwc:if={addChildSubTab2}>

		<template lwc:elseif={birthParenting}>

			<div
				class="slds-p-bottom_large slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1 subheading">
				{childName}</div>

					Time</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_small slds-p-top_medium">

				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_small slds-p-top_medium">
					<lightning-input-field field-name="If_Other__c" data-field="If_Other__c" label="If Other" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>

			</div>
		</template>
		<lightning-input-field field-name="Matter_ID__c" disabled="true" variant="label-hidden" class="slds-hidden" value={childMatterActivity} ></lightning-input-field>	
		<lightning-input-field field-name="Parent_1__c" disabled="true" variant="label-hidden" class="slds-hidden" value={parent_1} ></lightning-input-field>	
		<lightning-input-field field-name="Parent_2__c" disabled="true" variant="label-hidden" class="slds-hidden" value={parent_2} ></lightning-input-field>	
		<template if:true={isInsert}>		<!--Set default value for new records-->
			<lightning-input-field field-name="Child_Resides_With__c" disabled="true" variant="label-hidden" class="slds-hidden" value="Both" ></lightning-input-field>	
		</template>		
	</lightning-record-edit-form>
	<div class="slds-col slds-size_1-of-1 controls slds-grid slds-grid_align-center class11">
		<template if:true={managePreviousButtons}>
			<button class="next-button previousBtnPadding" onclick={handlePrevious}>
				<span class="arrow previousBtnArrow">←</span>
				PREVIOUS
			</button>
		</template>
		<template if:false={managePreviousButtons}>
			<button class="cancel-button" onclick={handleResetProgressChild}>
				CANCEL
			</button>
		</template>
		<template if:true={manageNextButtons1}>
			<button class="next-button nextBtnPadding" onclick={handleNext}>SAVE & CONTINUE
				<span class="arrow nextBtnArrow">→</span>
			</button>
		</template>
		<template if:true={manageSaveButtons}>
			<button class="next-button nextBtnPadding" onclick={saveChildRecord}>SUBMIT SECTION
				<span class="arrow nextBtnArrow">→</span>
			</button>
		</template>
	</div>
</template>
