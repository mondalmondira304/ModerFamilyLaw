<template>
    <div class="">
        <img src={logoImg} alt="image sample"  />
    </div>
    <div class="login-container slds-m-vertical_large">
    <div class="login-card ">
        <div class="slds-grid slds-wrap ">
            <!--div class="title slds-col slds-size_1-of-1 slds-m-top_small" >Client Portal</div-->
        </div>
            <template lwc:if={showSpinner}>
                <div class="spinnerContainer">
                    <lightning-spinner alternative-text="Loading" variant="brand" size="medium"></lightning-spinner>
                </div>
            </template>
            <template lwc:if={isInit}>
                <p class="title slds-col slds-size_1-of-1 slds-m-top_small">{pageTitle}</p>
                <div class="slds-col slds-size_1-of-1">
                    <img src={loginGradientImg} alt="image sample"/>
                </div>
                <template lwc:if={passwordChangeSuccess}>
                    <p class="slds-m-vertical_medium">Your password has been successfully updated! Use this password to login. You will be redirected to the login page automatically or you can click on the button below.</p>
                    <a href={loginUrl} class="login-button slds-p-top_meduim" target="_blank">
                        Continue To Login
                    </a>
                </template>
                <template lwc:elseif={hasOTP}>
                    <div class="slds-p-around_medium">
                        <p class="slds-m-bottom_large slds-text-align_center">Please check your email for a one-time code and enter it below.</p>
                        <lightning-input type="text" label="One-Time Code" class="otp slds-m-bottom_large slds-text-align_left" value={otpCode} onchange={handleotpCodeChange} required></lightning-input>
                        <p class="slds-text-align_center">Please enter and confirm your new password.</p>
                            <lightning-checkbox-group name="Checkbox Group"
                                label="Checkbox Group"
                                options={options}
                                value={values}
                                disabled="true"
                                variant="label-hidden"
                                class="slds-text-align_left">
                            </lightning-checkbox-group>                
                        <lightning-input type="password" label="New Password" class="newPassword slds-text-align_left" value={newPassword} onchange={handleNewPasswordChange} required></lightning-input>
                        <lightning-input type="password" label="Confirm New Password" class="confirmNewPassword slds-text-align_left" value={confirmNewPassword} onchange={handleConfirmNewPasswordChange} required></lightning-input>
                        <div class="slds-m-vertical_small">
                            <template lwc:if={showUpdateButton}>
                                <div class="login-button slds_p slds-grid slds-grid_align-center" onclick={handleUpdatePassword}>
                                    <span class="login-text">Update My Password</span>
                                </div>
                            </template>
                            <template lwc:if={otpError}>                     
                                <!-- <div class="login-button slds_p slds-grid slds-grid_align-center" onclick={handleResendCode}>
                                    <span class="login-text">Request Another one-time code</span>
                                </div>    -->
                                <div class="slds-col slds-p-top_large">
                                    <div class="btn-link" onclick={handleResendCode}>Request another one-time code</div>
                                </div>                     
                            </template>    
                        </div>

                    </div>
                </template>
                <!--template lwc:elseif={hasOTP}>
                    <div class="">                        
                        <p class="slds-m-bottom_large slds-text-align_left">Please check your email for a One-Time Password and enter it below.</p>
                        <lightning-input type="text" label="One-Time Password" class="otp slds-text-align_left" value={otpCode} onchange={handleotpCodeChange} required></lightning-input>
                        <div class="slds-m-vertical_large">    
                            <div class="login-button slds-p-top_medium slds-grid slds-grid_align-center"  onclick={handleNext} >
                                <span class="login-text">Next</span>
                            </div>                           
                            <div class="slds-p-top_medium " ></div>                            
                            <div class="login-button slds_p slds-grid slds-grid_align-center" onclick={handleResendCode}>
                                <span class="login-text">Resend The One-time Password</span>
                            </div>
                        </div>

                    </div>
                </template-->
                <template lwc:else> 
                    <div class="">
                        <p class="slds-m-top_x-small slds-m-bottom_large slds-text-align_center">Enter your email and we’ll send you a one-time code to continue.</p>
                        <lightning-input type="email" label="Registered Email" value={username} onchange={handleUsernameChange} class="username slds-m-bottom_large slds-text-align_left" required></lightning-input>
                        <div class="slds-m-bottom_medium"></div>
                        <div class="slds-m-vertical_large">
                            <div class="login-button slds-grid slds-grid_align-center"  onclick={handleRequestOTP} >
                                 <span class="login-text">Send my one-time code</span>
                            </div>                            
                            <div class="slds-p-top_medium " ></div>
                            <!-- <div class="login-button slds_p slds-grid slds-grid_align-center" onclick={handleAlreadyHaveCode}>
                                <span class="login-text">I Already Have A One-time Code</span>
                            </div> -->
                            <div class="slds-col slds-p-top_large">
                                <div class="btn-link" onclick={handleAlreadyHaveCode}>I already have a one-time code</div>
                            </div>
                        </div>

                    </div>
                </template>
            </template>
            </div>
        </div>
</template>
