<template>
    <div>
        <div class="header slds-align_absolute-center">
            <img src={headerImg} alt="Modern Family Law" class="header-img" loading="lazy" />
        </div>

        <!-- MAIN CONTENT - Show when not waiting or viewing fee agreement -->
        <template if:true={showMainContent}>
            
            <!-- Qualified: Gold, Silver, Bronze -->
            <template if:true={isQualified}>
                <div class="slds-grid slds-grid_vertical slds-align_absolute-center slds-p-around_large" >
                    <!-- Header centered -->
                    <div class="slds-text-align_center">
                        <h2 class="heading-large slds-m-bottom_small">CONGRATULATIONS!</h2>
                        <div class="slds-text-title slds-m-bottom_xx-small" style="font-size: 1.2rem;">{accountName}</div>
                        <span class="slds-text-heading_small slds-m-bottom_large" style="display: block;">
                            You have pre-qualified as 
                            <span class="slds-text-color_brand slds-text-title_bold"> {creditDecision}</span>.
                        </span>
                    </div>

                    <div class="slds-grid slds-wrap slds-gutters slds-m-vertical_x-large price-grid">
                        <!-- ORIGINAL -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_large">
                            <article class="price-card price-card--base slds-shadow_small">
                                <h3 class="price-card__title">STANDARD RETAINER</h3>

                                <div class="price-label">Retainer</div>
                                <div class="price-value">
                                    <lightning-formatted-number value={standardRetainer} format-style="currency"
                                        currency-code="USD">
                                    </lightning-formatted-number>
                                </div>

                                <template if:true={hasStandardTotal}>
                                    <div class="price-label slds-m-top_large">Total Amount</div>
                                    <div class="price-value">
                                        <lightning-formatted-number value={standardTotalAmount} format-style="currency"
                                            currency-code="USD">
                                        </lightning-formatted-number>
                                    </div>
                                </template>
                            </article>
                        </div>

                        <!-- DISCOUNTED -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_large">
                            <article class="price-card price-card--accent slds-shadow_small">
                                <template if:true={hasPercentOff}>
                                    <span class="price-badge" aria-label="Discount">{percentOff}% OFF</span>
                                </template>

                                <h3 class="price-card__title">{creditDecision}</h3>

                                <div class="price-label">Retainer</div>
                                <div class="price-value">
                                    <lightning-formatted-number value={reducedRetainerDisplay} format-style="currency"
                                        currency-code="USD">
                                    </lightning-formatted-number>
                                </div>

                                <template if:true={hasDiscountedTotal}>
                                    <div class="price-label slds-m-top_large">Total Amount</div>
                                    <div class="price-value">
                                        <lightning-formatted-number value={discountedTotalAmount} format-style="currency"
                                            currency-code="USD">
                                        </lightning-formatted-number>
                                    </div>
                                </template>
                            </article>
                        </div>
                    </div>

                    <!-- Request Fee Agreement button -->
                    <template lwc:if={hasFeeAgreement}>
                        <div class="slds-grid slds-grid_align-center slds-p-bottom_large slds-size_1-of-1">
                            <button class="next-button nextBtnPadding" onclick={handleContinue}>
                                CONTINUE TO FEE AGREEMENT<span class="arrow nextBtnArrow">→</span>
                                </button>
                            </div>
                    </template>


                </div>
            </template>

            <!-- not qualified -->
            <template if:true={showFull}>
                <div class="slds-p-around_x-large slds-grid slds-grid_vertical slds-align_absolute-center"
                    style="min-height: 400px;">
                    <div class="slds-col slds-size_1-of-1 slds-text-align_center">
                        <h2 class="heading-large slds-m-bottom_small">FULL RETAINER REQUIRED</h2>
                        
                        <span class="slds-text-heading_small primary-color slds-m-bottom_large" style="display: block;">
                            Based on your application, the standard retainer applies.
                        </span>
                    </div>
                    <div class="slds-grid slds-gutters slds-align_absolute-center slds-m-bottom_x-large" style="max-width: 700px;">
                        <article class="price-card price-card--base slds-shadow_small">
                            <h3 class="price-card__title">STANDARD RETAINER</h3>

                            <div class="price-label">Retainer</div>
                            <div class="price-value">
                                <lightning-formatted-number value={standardRetainer} format-style="currency"
                                    currency-code="USD">
                                </lightning-formatted-number>
                            </div>

                            <template if:true={hasStandardTotal}>
                                <div class="price-label slds-m-top_large">Total Amount</div>
                                <div class="price-value">
                                    <lightning-formatted-number value={standardTotalAmount} format-style="currency"
                                        currency-code="USD">
                                    </lightning-formatted-number>
                                </div>
                            </template>
                        </article>
                    </div>
                    
                    <!-- Request Fee Agreement button -->
                    <template lwc:if={hasFeeAgreement}>
                        <div class="slds-grid slds-grid_align-center slds-p-bottom_large slds-size_1-of-1">
                            <button class="next-button nextBtnPadding" onclick={handleContinue}>
                                CONTINUE TO FEE AGREEMENT<span class="arrow nextBtnArrow">→</span>
                               </button>
                           </div>
                    </template>
                </div>
            </template>

            <!-- Frozen -->
            <template if:true={showFrozen}>
                <div class="slds-p-around_x-large slds-grid slds-grid_vertical slds-align_absolute-center"
                    style="min-height: 400px;">
                    <div class="slds-col slds-size_1-of-1 slds-text-align_center">
                        <h2 class="heading-large slds-m-bottom_x-small">CREDIT FREEZE DETECTED</h2>
                        <div class="slds-text-title slds-m-bottom_small" style="font-size: 1.2rem;">{accountName}</div>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_large">
                            We can't complete the evaluation because a credit freeze is active.
                        </p>

                        <div class="slds-text-title_caps slds-text-color_weak">STANDARD RETAINER</div>
                        <div class="slds-text-heading_medium slds-m-top_xx-small" style="font-weight:600;">
                            <lightning-formatted-number value={standardRetainer} format-style="currency"
                                currency-code="USD">
                            </lightning-formatted-number>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Error / validation -->
            <template if:true={showValidation}>
                <div class="slds-p-around_x-large slds-grid slds-grid_vertical slds-align_absolute-center"
                    style="min-height: 400px;">
                    <div class="slds-col slds-size_1-of-1 slds-text-align_center">
                        <h2 class="heading-large slds-m-bottom_small">FULL RETAINER REQUIRED</h2>
                        <div class="slds-text-title slds-m-bottom_small" style="font-size: 1.2rem;">{accountName}</div>

                        <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_large">
                            There was an issue validating your credit information; as a result, you have qualified for the full retainer.
                        </p>

                        <!-- Validation messages -->
                        <template for:each={creditMessageLines} for:item="msg">
                            <p key={msg} class="slds-m-vertical_xx-small">{msg}</p>
                        </template>

                        <div class="slds-grid slds-gutters slds-align_absolute-center slds-m-bottom_x-large" style="max-width: 700px;">
                            <article class="price-card price-card--base slds-shadow_small">
                                <h3 class="price-card__title">STANDARD RETAINER</h3>

                                <div class="price-label">Retainer</div>
                                <div class="price-value">
                                    <lightning-formatted-number value={standardRetainer} format-style="currency"
                                        currency-code="USD">
                                    </lightning-formatted-number>
                                </div>

                                <template if:true={hasStandardTotal}>
                                    <div class="price-label slds-m-top_large">Total Amount</div>
                                    <div class="price-value">
                                        <lightning-formatted-number value={standardTotalAmount} format-style="currency"
                                            currency-code="USD">
                                        </lightning-formatted-number>
                                    </div>
                                </template>
                            </article>
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- WAITING SCREEN -->
        <template if:true={showWaiting}>
            <div class="slds-p-around_x-large slds-grid slds-grid_vertical slds-align_absolute-center"
                style="min-height: 400px;">
                <div class="slds-col slds-size_1-of-1 slds-text-align_center">
                    <img src={imageUrl} alt="" class="spinner-img slds-align_absolute-center" />
                    <h2 class="heading-large slds-m-top_large">Preparing Your Fee Agreement</h2>
                    <p class="slds-text-body_regular slds-text-color_weak slds-m-top_small">
                        Please wait while we generate your documents...
                    </p>
                </div>
            </div>
        </template>

        <!-- FEE AGREEMENT SCREEN - Only show if we have a URL -->
        <template if:true={showFeeAgreement}>
            <!-- Show agreement if URL exists -->
            <template if:true={signingUrl}>
                <div class="slds-p-around_large">
                    <div class="slds-grid slds-grid_vertical slds-align_absolute-center">
                        <div class="slds-col slds-size_1-of-1 slds-text-align_center slds-m-bottom_medium">
                            <h2 class="heading-large slds-m-bottom_small">Your Fee Agreement is Ready</h2>
                            <p class="slds-text-body_regular slds-m-bottom_large">
                                Please review and sign your fee agreement using the link below.
                            </p>
                            
                            <!-- Sign Agreement Button -->
                            <a href={signingUrl} target="_blank" class="slds-button slds-button_brand slds-m-bottom_medium">
                                <lightning-icon icon-name="doctype:pdf" size="small" class="slds-m-right_x-small"></lightning-icon>
                                Open Fee Agreement
                            </a>
                            
                            <!-- Back button -->
                            <div class="slds-m-top_large">
                                <button class="slds-button slds-button_neutral" onclick={handleBackToDecision}>
                                    ← Back to Decision
                                </button>
                            </div>
                        </div>
                        
                        <!-- Optional: Embed iframe -->
                        <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
                            <div class="slds-box" style="height: 600px; padding: 0;">
                                <iframe 
                                    src={signingUrl} 
                                    style="width: 100%; height: 100%; border: none;"
                                    title="Fee Agreement">
                                </iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Show error if no URL -->
            <template if:false={signingUrl}>
                <div class="slds-p-around_x-large slds-grid slds-grid_vertical slds-align_absolute-center"
                    style="min-height: 400px;">
                    <div class="slds-col slds-size_1-of-1 slds-text-align_center">
                        <lightning-icon icon-name="utility:error" size="large" variant="error" class="slds-m-bottom_medium"></lightning-icon>
                        <h2 class="heading-large slds-m-bottom_small">Unable to Load Fee Agreement</h2>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_large">
                            The signing URL is not available yet. This may take a few moments to generate.
                        </p>
                        
                        <button class="slds-button slds-button_neutral" onclick={handleBackToDecision}>
                            ← Back to Decision
                        </button>
                    </div>
                </div>
            </template>
        </template>

    </div>
</template>
