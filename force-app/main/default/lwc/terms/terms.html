        <li>Mediation and Alternative Dispute Resolution: Information may be shared with mediators, arbitrators, and

    <lightning-accordion-section name="ConsumerHealth" label="Consumer Health Data Privacy Policy">
      <p><i>Last Updated: March 14, 2026</i></p>

      <h3>1. SCOPE AND PURPOSE OF THIS POLICY</h3>
      <p>This Consumer Health Data Privacy Policy ("Policy") is published by Johnson Family Law, PC, dba Modern Family
        Law ("Modern Family Law," "the Firm," "we," "us," or "our") pursuant to the Washington My Health My Data Act,
        RCW 19.373 (the "MHMDA"), and applicable California consumer health data privacy laws. This Policy applies to
        the collection, use, sharing, and sale of "consumer health data" as defined under the MHMDA.</p>

      <p>"Consumer health data" means personal information that is linked or reasonably linkable to a consumer and that
        identifies the consumer's past, present, or future physical or mental health status. This includes, but is not
        limited to, information regarding individual health conditions, treatment, diseases, or diagnosis; social,
        psychological, behavioral, and medical interventions; bodily functions, vital signs, symptoms, or measurements
        of the foregoing; diagnoses or diagnostic testing, treatment, or medication; gender-affirming care information;
        reproductive or sexual health information; biometric data; genetic data; precise location information that could
        reasonably indicate a consumer's attempt to acquire or receive health services or supplies; and data that
        identifies a consumer seeking health care services.</p>

      <p>This Policy is a standalone disclosure as required by the MHMDA and supplements, but does not replace, our
        general Privacy Notice, which addresses our broader data practices.</p>

      <h3>2. CATEGORIES OF CONSUMER HEALTH DATA WE COLLECT AND PURPOSES FOR COLLECTION</h3>
      <p>In the course of providing family law legal services — including divorce, child custody, child support, spousal
        maintenance, property division, protective orders, adoption, and related proceedings — Modern Family Law may
        collect the following categories of consumer health data for the purposes described below:</p>

      <h4>2.1 Physical and Mental Health Information</h4>
      <ul>
        <li>Medical records and history of physical health conditions, diagnoses, and treatments</li>
        <li>Mental health records, including psychological evaluations, counseling records, and psychiatric treatment
          records</li>
        <li>Substance abuse treatment records and recovery documentation</li>
        <li>Disability or impairment information relevant to custody, support, or property matters</li>
      </ul>
      <p><strong>Purpose:</strong> This information is collected to provide legal representation and advice in family
        law matters where the physical or mental health of a party or child is relevant. Health information may be
        necessary for custody evaluations, parenting plan determinations, spousal support calculations, protective order
        proceedings, and other matters where health status is material to the legal proceeding.</p>

      <h4>2.2 Reproductive and Sexual Health Information</h4>
      <ul>
        <li>Reproductive health records, pregnancy-related information, and fertility treatment records</li>
        <li>Sexual health information when relevant to the legal matter</li>
      </ul>
      <p><strong>Purpose:</strong> This information is collected only when directly relevant to a family law matter,
        such as paternity proceedings, custody disputes, or where reproductive health is otherwise material to the legal
        representation.</p>

      <h4>2.3 Biometric and Genetic Data</h4>
      <ul>
        <li>DNA or genetic testing results, including paternity test results</li>
        <li>Biometric identifiers used for Portal authentication (e.g., fingerprint or facial recognition data)</li>

      <h3>6. YOUR RIGHTS REGARDING YOUR CONSUMER HEALTH DATA</h3>

      <h4>6.1 Right to Access</h4>
      <p>You have the right to confirm whether we are collecting, sharing, or selling your consumer health data. You

      <p>You have the right to request that we delete your consumer health data. Upon receiving a verified deletion

      <h4>6.3 Right to Withdraw Consent</h4>
      <p>You have the right to withdraw your consent to our collection, sharing, or selling of your consumer health

      <h4>6.4 Right to Appeal</h4>
      <p>If we deny your request to exercise any of the rights described above, you have the right to appeal our

      <h3>What Are Cookies?</h3>
      <p>Cookies are small text files that are placed on your computer or mobile device when you visit a website. They
        are widely used to make websites function efficiently, provide a better user experience, and supply information
        to website operators. This Cookie Notice explains how Modern Family Law, PLLC ("Modern Family Law," "we," "us,"
        or "our") uses cookies and similar tracking technologies on our website and client portal at
        www.modernfamilylaw.com.</p>

      <h3>Types of Cookies We Use</h3>

      <p>These cookies are essential for the operation of our website and client portal. They enable core functionality
        such as security, session management, and user authentication. Without these cookies, the Portal cannot function
        properly. These cookies do not collect personal information for marketing purposes and cannot be disabled.</p>
      <ul>
        <li>Session authentication and Portal login</li>
        <li>Security tokens and cross-site request forgery (CSRF) protection</li>
        <li>Load balancing and server session management</li>
        <li>Cookie consent preferences</li>
      </ul>

      <h4>Functional Cookies</h4>
      <p>These cookies enable enhanced functionality and personalization, such as remembering your preferences, language
        settings, and display options within the Portal. They may be set by us or by third-party providers whose
        services we have integrated into our pages.</p>
      <ul>
        <li>User interface preferences and display settings</li>
        <li>Language and region preferences</li>
        <li>Previously viewed content and navigation history within the Portal</li>
      </ul>

      <h4>Analytics and Performance Cookies</h4>
      <p>These cookies collect information about how visitors use our website and Portal, including which pages are
        visited most often, how visitors navigate between pages, and whether users encounter error messages. This
        information is used to improve the performance and usability of our website and Portal. All information
        collected by these cookies is aggregated and anonymized.</p>
      <ul>
        <li>Page visit counts and navigation patterns</li>
        <li>Error reporting and performance monitoring</li>
        <li>Feature usage analytics to improve the Portal experience</li>
      </ul>

      <h3>How to Manage Cookies</h3>
      <p>When you first visit our website, you will be presented with a cookie consent banner that allows you to accept
        or decline non-essential cookies. You may change your cookie preferences at any time by clicking the "Cookie
        Settings" link in our website footer.</p>

      <p>You may also manage cookies through your browser settings:</p>
      <ul>
        <li>Most browsers allow you to view, manage, and delete cookies through the browser settings or preferences menu
        </li>
        <li>You may configure your browser to block all cookies, accept all cookies, or notify you when a cookie is set
        </li>
        <li>If you block all cookies, some features of our website and Portal may not function properly, including login

      <h3>Universal Opt-Out Mechanisms</h3>

        Wide Web Consortium (W3C). These guidelines provide a framework for making web content more accessible to people

        and neurological disabilities.</p>

        <li>Providing clear and consistent navigation throughout the website and portal</li>
        <li>Ensuring content is compatible with assistive technologies, including screen readers, screen magnifiers, and
          voice recognition software</li>

        <li>Providing captions and transcripts for multimedia content where applicable</li>

      </ul>

      <h3>Ongoing Efforts</h3>
