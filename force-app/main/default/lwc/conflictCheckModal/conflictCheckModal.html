<template>
    <template if:true={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">

                <!-- Header (native brand accent + brand icon) -->
                <header class="slds-modal__header slds-border_left slds-border_left_brand">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon
    icon-name="utility:shield"
    size="small"
    class="slds-icon-text-brand"
></lightning-icon>

                        </div>

                        <div class="slds-media__body">
                            <h2 class="slds-text-heading_medium">Conflict Check Confirmation</h2>

                            <div class="slds-m-top_xx-small">
                                <span class="slds-text-body_small slds-text-color_weak">
                                    Please confirm before proceeding.
                                </span>

                                <!-- small native "brand" pill for a bit more blue -->
                                <span class="slds-badge slds-theme_inverse slds-m-left_small">
                                    Required
                                </span>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_large">
                    <!-- Light, native-looking message box (no dark gray) -->
                    <div class="slds-box slds-theme_shade">
                        <p class="slds-text-body_regular">
                            I confirm that I have completed a conflict check and no conflicts were identified.
                        </p>
                    </div>

                    <div class="slds-m-top_large slds-align_absolute-center">
                        <lightning-input
                            type="checkbox"
                            label="Confirmed"
                            checked={isConfirmed}
                            onchange={handleCheckboxChange}
                            disabled={isSaving}
                        ></lightning-input>
                    </div>

                    <template if:true={errorMessage}>
                        <div
                            class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium"
                            role="alert"
                        >
                            <span class="slds-assistive-text">error</span>
                            <h2>{errorMessage}</h2>
                        </div>
                    </template>

                    <template if:true={isSaving}>
                        <div class="slds-is-relative slds-m-top_medium">
                            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                        </div>
                    </template>
                </div>

                <!-- Footer -->
               <footer class="slds-modal__footer">
    <div class="slds-p-horizontal_large slds-grid slds-grid_align-end slds-gutters_small">
        <lightning-button
            label="Cancel"
            onclick={handleCancel}
            disabled={isSaving}
        ></lightning-button>

        <lightning-button
            variant="brand"
            label={nextLabel}
            onclick={handleNext}
            disabled={isNextDisabled}
        ></lightning-button>
    </div>
</footer>


            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
