<template>

	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
		<div class="slds-col heading slds-size_1-of-1">Opposing Party - Social Media</div>

	  	<lightning-record-edit-form record-id={selectedRecordId} onsuccess={handleSuccess} object-api-name="Account">

		  	<div class="slds-grid slds-wrap slds-gutters slds-size_1-of-1">
				<!-- Column A -->
			  	<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
		  	<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
					  <lightning-input-field field-name="Instagram__c" data-field="Instagram__c" autocomplete="off" label = "Instagram" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
					  <lightning-input-field field-name="Facebook__c" data-field="Facebook__c" autocomplete="off" label = "Facebook" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
				  </div>
				</div>
				<!-- Column B -->
			  	<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
				  	<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
					  <lightning-input-field field-name="LinkedIn__c" data-field="LinkedIn__c" autocomplete="off" label = "LinkedIn" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
					  <lightning-input-field field-name="Twitter__c" data-field="Twitter__c" autocomplete="off" label = "X/Twitter" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
				  </div>
			  	</div>

		  	</div>

	  	</lightning-record-edit-form>

  	</div>
</template>
