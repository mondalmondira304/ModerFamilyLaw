<template>
	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
      	<div class="slds-col heading slds-size_1-of-1">Opposing Party - Military Service</div>

		<div class="slds-col slds-size_1-of-1">

			<lightning-record-edit-form record-id={selectedRecordId} onsuccess={handleSuccess} object-api-name="Account" density="comfy">
				
				<div class="slds-grid slds-wrap slds-gutters slds-size_1-of-1">
					<!-- Column A -->
					<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
			<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<lightning-input-field field-name="Military_Branch__c" data-field="Military_Branch__c" autocomplete="off" label = "Military Branch" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
						<lightning-input-field field-name="Military_Rank__c" data-field="Military_Rank__c" autocomplete="off" label = "Military Rank" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
					</div>
				  </div>
					<!-- Column B -->
					<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
						<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<lightning-input-field field-name="Military_Pay_Grade__c" data-field="Military_Pay_Grade__c" autocomplete="off" label = "Military Pay Grade" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
						<lightning-input-field field-name="Currently_Service_Connected__c" data-field="Currently_Service_Connected__c" autocomplete="off" label = "Currently Sevice Connected?" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
					</div>
				</div>
			</div>
				
		</lightning-record-edit-form>

		</div>
	</div>
</template>
