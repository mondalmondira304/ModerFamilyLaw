<template>

	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
      <div class="slds-col heading slds-size_1-of-1">Opposing Party - Contact Information</div>

    <lightning-record-edit-form record-id={selectedRecordId} onsuccess={handleSuccess} object-api-name="Account" class="slds-p-around_small custom-form slds-size_1-of-1" density="comfy">

      <div class="slds-grid slds-wrap slds-gutters">
        <!-- Column A (full-width on mobile, half on desktop) -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

          <div class="form-container">
            <lightning-input-field field-name="FirstName" data-field="FirstName" autocomplete="off"
              label="First Name" class="custom-input" onchange={handleOnChange}
              isabled></lightning-input-field>
            <lightning-input-field field-name="MiddleName" data-field="MiddleName" autocomplete="off"
              label="Middle Name" class="custom-input" onchange={handleOnChange}
              disabled></lightning-input-field>
            <lightning-input-field field-name="LastName" data-field="LastName" autocomplete="off"
              label="Last Name" class="custom-input" onchange={handleOnChange}
              disabled></lightning-input-field>
          </div>

          <lightning-input-field field-name="Length_of_Residence__c" data-field="Length_of_Residence__c"
            pattern="^(?:[1-9]\d{0,2}|0)$" autocomplete="off" label="Length of Residence"
            variant="label-stacked" class="custom-input icon-color"
            onchange={handleOnChange} required></lightning-input-field>
          <!--Address-->
          <!--div class="slds-m-top_medium">
            <label class="labelCSS slds-p-left_x-small">Address Search</label>
            <div class="slds-m-bottom_medium "></div>
            <lightning-input-address style="margin-top: -2.5vh;" show-address-lookup variant="label-hidden"
              address-label="" street-label="Street Address" city-label="City" country-label="Country"
              province-label="State" postal-code-label="Zip Code" street={selectedAccount.PersonMailingStreet}
              city={selectedAccount.PersonMailingCity} province={selectedAccount.PersonMailingState}
              postal-code={selectedAccount.PersonMailingPostalCode} country={selectedAccount.PersonMailingCountry}
              onchange={handleOnChange} data-field="PersonMailingAddress" class="custom-input"
              required></lightning-input-address>
          </div-->

          <lightning-input-field field-name="PersonMailingStreet" variant="label-stacked" class="custom-input icon-color" autocomplete="off" onchange={handleOnChange} required="true"></lightning-input-field>
          <lightning-input-field field-name="PersonMailingCity" variant="label-stacked" class="custom-input icon-color" autocomplete="off" onchange={handleOnChange}  required="true"></lightning-input-field>
          <lightning-input-field field-name="PersonMailingState" variant="label-stacked" class="custom-input icon-color" autocomplete="off" onchange={handleOnChange}  required="true"></lightning-input-field>
          <lightning-input-field field-name="PersonMailingCountry" variant="label-stacked" class="custom-input icon-color" autocomplete="off" onchange={handleOnChange}  required="true"></lightning-input-field>
          <lightning-input-field field-name="PersonMailingPostalCode" variant="label-stacked" class="custom-input icon-color" autocomplete="off" onchange={handleOnChange}  required="true"></lightning-input-field>          

        </div>

        <!-- Column B -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

          <lightning-input-field field-name="PersonEmail" data-field="PersonEmail" variant="label-stacked" autocomplete="off"
            label="Email" class="custom-input"
            onchange={handleOnChange} required></lightning-input-field>

          <lightning-input-field field-name="PersonMobilePhone" data-field="PersonMobilePhone" variant="label-stacked"
            autocomplete="off" pattern="^(?:[+][\d\s\-\.\,\*\(\)]{10,15}|[\d\s\-\.\,\*\(\)]{10,14})$" 
            label="Mobile Phone" class="custom-input icon-color"
            onchange={handleOnChange}></lightning-input-field>

          <lightning-input-field field-name="Phone" data-field="Phone" variant="label-stacked" autocomplete="off"
            pattern="^(?:[+][\d\s\-\.\,\*\(\)]{10,15}|[\d\s\-\.\,\*\(\)]{10,14})$" label="Home Phone"
            class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>

          <div
            class="upload-container slds-col slds-size_12-of-12 slds-p-horizontal_small slds-p-top_medium slds-m-top_medium">
            <div class="upload-header">
              <span>UPLOAD DOCUMENTS</span>
              <lightning-helptext content="Please upload the required documents."
                class="icon-color"></lightning-helptext>
            </div>
            <p class="upload-instructions">Please upload the following files:</p>
            <ul class="file-list">
              <li><strong>Profile Picture</strong></li>
            </ul>
								<div class="upload-box">
									<p class="file-types">JPG, PNG</p>
									<lightning-file-upload
											name="fileUploader"
											accept={acceptedFormats}
											record-id={selectedRecordId}
											onuploadfinished={handleUploadFinished}
									>
									</lightning-file-upload>
								</div>
  
            <!--template if:true={uploadedFile}>
                <p class="uploaded-file">Uploaded: {uploadedFile.name}</p>
            </template-->
            <template if:true={listOfUploadedIdentityFiles}>
              <template for:each={listOfUploadedIdentityFiles} for:item="file" for:index="index">
                <lightning-pill
                  label={file.name}
                  name={index} 
                  key={file.id}
                  data-id={file.id}
                  data-field="uploadFile"
                  onremove={handleFileDelete}>
                </lightning-pill>
              </template>
            </template>               
          </div>

        </div>

            </div>
          </lightning-record-edit-form>

                </div>
    

</template>
