<template>
	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
		<div class="slds-col heading slds-size_1-of-1">Monthly Payroll Deductions</div>
		<lightning-record-edit-form record-id={selectedRecordId} object-api-name="Matters__c">
			
			<div class="slds-grid slds-wrap slds-gutters">
				<!-- Column A -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Insurance_life_accident_etc__c" data-field="Insurance_life_accident_etc__c"  label = "Life Insurance (Paid by Employer)" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Number_Covered_by_Health_Ins__c" data-field="Number_Covered_by_Health_Ins__c" label = "Number of People Covered by Health Insurance" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Child_Care_Deducted_from_Pay_Client__c" data-field="Child_Care_Deducted_from_Pay_Client__c" label = "Child Care Deducted from Pay" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Flex_Benefit_Deductions_Client__c" data-field="Flex_Benefit_Deductions_Client__c" label = "Flex Benefit Deductions" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Retirement_Deferred_Compensation__c" data-field="Retirement_Deferred_Compensation__c" label = "Retirement & Deferred Compensation" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
					</div>
				</div>
				<!-- Column B -->
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Health_Dental_Vision_Premium_Client__c" data-field="Health_Dental_Vision_Premium_Client__c"  label = "Health, Dental, Vision Premium" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Health_Insurance_Provider__c" data-field="Health_Insurance_Provider__c"  label = "Health Insurance Provider" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Health_Insurance_Provider_Address__c" data-field="Health_Insurance_Provider_Address__c"  label = "Health Insurance Provider’s Street Address" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
							<lightning-input-field field-name="Stock_Contribution_Deducted_from_Pay_C__c" data-field="Stock_Contribution_Deducted_from_Pay_C__c"  label = "Stock Contribution Deducted from Pay" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} autocomplete="off"></lightning-input-field>
						</div>
					</div>
				</div>
			</div>

		</lightning-record-edit-form>
  </div>
</template>
