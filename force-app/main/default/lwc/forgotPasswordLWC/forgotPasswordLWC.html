<template>
    <div class="">
        <img src={logoImg} alt="image sample" class="slds-col slds-m-vertical_xx-large slds-size_1-of-1" />
    </div>
    <div class="login-container slds-m-vertical_large">
        <div class="login-card">
            <div class="slds-grid slds-wrap">
                <div class="title slds-col slds-size_1-of-1 slds-m-top_small">Reset Your Password?</div>
                <div class="slds-col slds-size_1-of-1" >
                    <img src={loginGradientImg} alt="image sample"/>
                </div>
            </div>
            <div class="slds-col slds-m-top_small">
                <div class="slds-text-heading_medium slds-col slds-size_1-of-1 lds-p-top_xx-small slds-p-bottom_small slds-text-align_center">
                    Let's get you setup with a new password
                </div>
                <div class="slds-m-vertical_large"></div>
                <div class="slds-size_1-of-1 slds-grid slds-grid_align-center">
                    <div class="login-button slds-size_8-of-12  slds-wrap slds-p-vertical_xx-small slds-p-right_xx-small" onclick={handleForgetPassword}>
                        <div class="slds-p-left_large slds-align_absolute-center slds-col slds-size_9-of-12">Reset Password</div>
                        <div class="arrow loginButtonArrow slds-col slds-size_3-of-12 slds-p-vertical_small slds-p-horizontal_small ">➜</div>
                    </div>
                </div>
            </div>
            <div class="slds-m-vertical_large"></div>
        </div>
    </div>
</template>
