<template>
    <div class="slds-grid slds-grid_vertical slds-grid_align-center slds-p-around_large" style="height:100%;">
        <div class="slds-p-right_large slds-p-left_large slds-p-bottom_large">            
            <!--img src={imgUrl} alt="" class="slds-align_absolute-center spinner-img" style="height: 100px;" /-->
            <h2 class="slds-align_absolute-center heading-large slds-p-top_large slds-p-bottom_large">Welcome to Modern Family Law!</h2>            
        <template lwc:if={displayHeader}>      
            <template lwc:if={isGoldDecision}>  
                <h3 class="slds-align_absolute-center slds-card__header-title slds-p-bottom_xx-large">Our legal team will contact you shortly to discuss the next steps.</h3>
            </template>                
            <template lwc:else>             
                <h3 class="slds-align_absolute-center slds-card__header-title slds-p-bottom_xx-large">Let's Get Your Case Started!</h3>
            </template>
        </template>
        <div class="slds-p-bottom_large slds-text-align_center slds-size_1-of-1">
            <iframe width="100%" height="300"
                src="https://player.vimeo.com/video/1152384112?h=2220ae0c7a&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
                frameborder="0">
            </iframe>
        </div>

        </div>        
        <template lwc:if={isGoldDecision}></template>  <!--display no buttons-->
        <template lwc:else>          
            <div class="slds-grid slds-grid_align-center slds-p-bottom_large slds-size_1-of-1">        
                <template lwc:if={hasMatter}>
                    <button class="next-button nextBtnPadding" onclick={handleClientInterview}>
                        Start Your Client Interview<span class="arrow nextBtnArrow">→</span>
                    </button>
                </template>
                <template lwc:else>
                    <button disabled class="next-button nextBtnPadding">
                        Generating Your Case<span class="waiting-btn-bg"><img src={imageUrl} alt="" class="spinner-img btn-spinner slds-align_absolute-center" /></span>
                    </button>
                </template>
            </div>            
        </template>
    </div>
</template>
