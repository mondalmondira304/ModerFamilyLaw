<template>
	<div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
		<template if:false={addBankAccountPage}>
			<div class="slds-col heading slds-size_1-of-1">Assets-Bank Accounts</div>
		</template>
		<template if:true={addBankAccountPage}>
			<div class="slds-col heading slds-size_1-of-1">{addBankAccountsLabel} Bank Account</div>
		</template>
		<template if:true={addBalanceSheetPage}>
			<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-grid slds-grid_align-center subheading">Balance and Statements</div>
			<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-grid slds-grid_align-center subheading">{bankAccountName}</div>
		</template>

		<template if:false={addBankAccount}>
			<div class="slds-p-top_large slds-col slds-wrap slds-grid slds-size_1-of-1 slds-grid_align-center">
				<div class="slds-col slds-size_12-of-12 slds-p-horizontal_small slds-p-bottom_medium alignAddButton">
				<button class="custom-button" onclick={handleBankAccountVehicles}>
					<span class="button-text">Add</span>
					<lightning-icon icon-name="utility:add" size="xx-small" class="icon-style"></lightning-icon>
				</button>
				</div>

				<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-vertical_medium custom-table-container">
				<table class="slds-table slds-table_cell-buffer slds-table_bordered slds-max-medium-table_stacked-horizontal">
					<thead>
					<tr class="slds-line-height_reset">
						<th scope="col"><div class="slds-truncate" title="Account Name">Account Name</div></th>
						<th scope="col"><div class="slds-truncate" title="Bank">Bank</div></th>
						<th scope="col" class="slds-hide_x-small slds-show_medium">
						<div class="slds-truncate" title="Account Number">Account Number</div>
						</th>
						<th scope="col" class="slds-text-align_right"><div class="slds-truncate" title="Balance">Balance</div></th>
						<th scope="col" class="slds-text-align_right"><div class="slds-truncate" title="Actions">Actions</div></th>
					</tr>
					</thead>

					<tbody>
					<template if:true={isBankAccount}>
						<template for:each={recordsData} for:item="row" for:index="index">
							<tr key={row.fields.Id.value} class="slds-hint-parent">
							<!-- First cell is the row header in stacked view -->
							<th scope="row" data-label="Account Name">
								<div class="slds-truncate" title={row.fields.Name.value}>
								<span class="rowName"
										onclick={handleBankAccountCellClick}
										data-id={row.fields.Id.value}
										data-field="Bank_Account__c"
										data-index={index}>
									{row.fields.Name.value}
									<lightning-icon icon-name="utility:edit" size="xx-small" class="edit-icon"></lightning-icon>
								</span>
								</div>
							</th>
							<td data-label="Bank">
								<div class="slds-truncate" title={row.fields.Name_of_Bank__c}>{row.fields.Name_of_Bank__c.value}</div>
							</td>
							<td data-label="Account Number" class="slds-hide_x-small slds-show_medium">
								<div class="slds-truncate" title={row.fields.Account_Number_Last_4__c}>{row.fields.Account_Number_Last_4__c.value}</div>
							</td>
							<td data-label="Balance" class="slds-text-align_right">
								<div class="slds-truncate" title={row.fields.Account_Balance__c}>
								{row.fields.Account_Balance__c.displayValue}
								</div>
							</td>
							<td data-label="Actions" class="slds-cell-shrink slds-text-align_right">
								<button class="slds-button slds-button_icon slds-button_icon-border-filled"
										title="Delete"
										data-id={row.fields.Id.value}
										data-field="Bank_Account__c"
										data-index={index}
										onclick={handleDeleteChild}>
								<lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
								<span class="slds-assistive-text">Delete</span>
								</button>
							</td>
							</tr>
						</template>
					</template>
					</tbody>
				</table>
				</div>
			</div>
		</template>


		<lightning-record-edit-form record-id={selectedRecordId} object-api-name="Bank_Account__c" onsuccess={handleSuccess}>

			<template lwc:if={addBankAccountPage}>
				<div class="slds-grid slds-wrap slds-gutters">
					<!-- Column A -->
					<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
						<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
							<lightning-input-field field-name="Name" data-field="Name" label = "Bank Account Name" autocomplete="off" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} required></lightning-input-field>
							<lightning-input-field field-name="Jointly_Owned_With_Text__c" data-field="Jointly_Owned_With_Text__c" label = "Jointly Owned with?" autocomplete="off" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
							<lightning-input-field field-name="Related_To_Text__c" data-field="Related_To_Text__c" label = "Owned by?" autocomplete="off" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
							<lightning-input-field field-name="Related_Matter__c" disabled="true" variant="label-hidden" class="slds-hidden" value={childMatterActivity} ></lightning-input-field>		
							<!--lightning-input-field field-name="Related_To__c" disabled="true" variant="label-hidden" class="slds-hidden" value={parentRecId} ></lightning-input-field-->	
						</div>
					
					</div>
					<!-- Column B -->
					<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
						<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
							<lightning-input-field field-name="Name_of_Bank__c" data-field="Name_of_Bank__c" label = "Name of Bank" autocomplete="off" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} ></lightning-input-field>
							<lightning-input-field field-name="Account_Number_Last_4__c" data-field="Account_Number_Last_4__c" autocomplete="off" label = "Account Number (Last 4 Digits)" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} ></lightning-input-field>
							<lightning-input-field field-name="Marital_or_Separate__c" data-field="Marital_or_Separate__c" autocomplete="off" label = "Marital or Separate?" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} ></lightning-input-field>
						</div>

					</div>
				</div>
			</template>

			<template lwc:elseif={addBalanceSheetPage}>
				<div class="slds-grid slds-wrap slds-gutters">

					<div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
						<div class="slds-col slds-wrap slds-grid slds-size_1-of-2 slds-grid_align-center">
							<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
								<lightning-input-field field-name="Account_Balance__c" data-field="Account_Balance__c" autocomplete="off" label = "Balance in Account" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange} required></lightning-input-field>
							</div>
						</div>
						<div class="slds-col slds-wrap slds-grid slds-size_1-of-2 slds-grid_align-center">
							<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-top_medium">
								<lightning-input-field field-name="Account_Balance_as_of__c" data-field="Account_Balance_as_of__c" autocomplete="off" label = "Date of Balance" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
							</div>

							<div class="upload-container slds-col slds-size_1-of-1 slds-p-around_large slds-m-bottom_medium">
								<div class="upload-header">
									<span>UPLOAD DOCUMENTS</span>
									<lightning-helptext content="Please upload the required documents." class="icon-color"></lightning-helptext>
								</div>
								<p class="upload-instructions">Please upload the following files:</p>
								<ul class="file-list">
									<li><strong>Six Months of Bank Statements</strong></li>
								</ul>
									<div class="upload-box">
											<p class="file-types">JPG, PDF, CSV, DOCX, XLSX</p>
										<lightning-file-upload
											name="fileUploader"
											accept={acceptedFormats}
											record-id={selectedRecordId}
											multiple
											onuploadfinished={handleUploadFinished}
										>
										</lightning-file-upload>
									</div>			
								<template if:true={listOfUploadedBankFileNames}>
									<template for:each={listOfUploadedBankFileNames} for:item="file" for:index="index">
										<lightning-pill
											label={file.name}
											name={index} 
											key={file.id}
											data-id={file.id}
											data-field="uploadFile"
											onremove={handleFileDelete}>
										</lightning-pill>
									</template>
								</template>
							</div>

						</div>
					</div>

				</div>
			</template>

		</lightning-record-edit-form>
		<div class="slds-col slds-size_1-of-1 controls slds-grid slds-grid_align-center slds-p-top_medium">
			<template if:false={manageBankAccountNextButtons}>
				<button class="next-button nextBtnPadding slds-m-top_xx-large" onclick={handleSaveChild}>SUBMIT SECTION
					<span class="arrow nextBtnArrow">→</span>
				</button>
			</template>
		</div>
		<div class="slds-col slds-size_1-of-1 controls slds-grid slds-grid_align-center">
			<template if:true={manageBankAccountPreviousButtons}>
				<button class="next-button previousBtnPadding slds-m-top_xx-large" onclick={handleBankAccountPrevious}>
					<span class="arrow previousBtnArrow">←</span>
					PREVIOUS
				</button>
			</template>
			<template if:true={manageBankAccountNextButtons1}>
				<button class="next-button nextBtnPadding slds-m-top_xx-large" onclick={handleBankAccountNext}>SAVE & CONTINUE
					<span class="arrow nextBtnArrow">→</span>
				</button>
			</template>
			<template if:true={manageBankAccountButtons}>
				<button class="next-button nextBtnPadding slds-m-top_xx-large" onclick={handleSave}>SAVE & CONTINUE
					<span class="arrow nextBtnArrow">→</span>
				</button>
			</template>
		</div>
	</div>
</template>
