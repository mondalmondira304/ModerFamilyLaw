<template>
    <div class="slds-p-around_small slds-col slds-grid slds-grid_align-center slds-wrap slds-size_1-of-1">
        <div class="slds-col heading slds-size_1-of-1">{addRetirementAccountsLabel} Retirement Account</div>
        <template if:false={addRetirementAccount}>
			<div class="slds-p-top_large slds-col slds-wrap slds-grid slds-size_1-of-1 slds-grid_align-center">
				<div class="slds-col slds-size_12-of-12 slds-p-horizontal_small slds-p-bottom_medium alignAddButton">
					<button class="custom-button" onclick={handleRetirementVehicles}>
						<span class="button-text">Add</span>
						<lightning-icon icon-name="utility:add" size="xx-small" class="icon-style"></lightning-icon>
					</button>
				</div>

				<div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-p-vertical_medium custom-table-container">
					<table class="custom-table">
						<thead>
							<tr>
								<th>Account Name</th>
								<th>Bank</th>
								<th>Account Number</th>
								<th>Balance</th>
							</tr>
						</thead>
						<tbody>
                            <template if:true={isRetirementAccount}>
                                <template for:each={recordsData} for:item="row">
                                    <tr key={row.fields.Id.value}>
                                        <td>
                                            <span class="rowName" onclick={handleRetirementCellClick} data-id={row.fields.Id.value} data-field="Retirement_Account__c">{row.fields.Name.value}<lightning-icon icon-name="utility:edit" size="xx-small" class="edit-icon"></lightning-icon></span>
                                        </td>
                                        <td>{row.fields.Name_of_Retirement_Bank__c.value}</td>
                                        <td>{row.fields.Account_Number_Last_4__c.value}</td>
                                        <td>{row.fields.Current_Balance__c.displayValue}</td>
                                        <td><span data-id={row.fields.Id.value} data-field="Retirement_Account__c" onclick={handleDeleteChild}><lightning-icon icon-name="utility:delete" size="x-small" class="edit-icon"></lightning-icon></span></td>
                                    </tr>
                                </template>
                            </template>
						</tbody>
					</table>
				</div>
			</div>
		</template>

        <template if:true={addRetirementAccount}>
            <lightning-record-edit-form record-id={selectedRecordId} object-api-name="Retirement_Account__c" onsuccess={handleSuccess} >                

                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Column A -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="slds-col slds-wrap slds-grid slds-size_1-of-1">
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-input-field field-name="Name" data-field="Name" autocomplete="off" label = "Retirement Account Name" variant="label-stacked" class="custom-input icon-color" onchange={handleRetirementAccountCreation}></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-input-field field-name="Account_Number_Last_4__c" data-field="Account_Number_Last_4__c" autocomplete="off" label = "Last 4 Digits of Account Number" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-input-field field-name="Account_Titled__c" data-field="Account_Titled__c" autocomplete="off" label = "Account Titled" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-input-field field-name="Jointly_Owned_With_Text__c" data-field="Jointly_Owned_With_Text__c" autocomplete="off" label = "Jointly Owned With?" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <label class="labelCSS">Average Monthly Savings and Investments</label>
                                <lightning-input-field field-name="Average_monthly_savings_and_investments__c" data-field="Average_monthly_savings_and_investments__c" autocomplete="off" label = "Average Monthly Savings and Investment" variant="label-hidden" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-input-field field-name="Marital_or_Separate__c" data-field="Marital_or_Separate__c" autocomplete="off" label = "Marital or Separate" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
                            </div>
                            <lightning-input-field field-name="Related_Matter__c" disabled="true" variant="label-hidden" class="slds-hidden" value={childMatterActivity} ></lightning-input-field>	
                        </div>
                    </div>
                    <!-- Column B -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="slds-col slds-wrap slds-grid slds-size_1-of-1">

                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-input-field field-name="Type_of_Retirement_Account__c" data-field="Type_of_Retirement_Account__c" autocomplete="off" label = "Type of Account" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}  ></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_12-of-12 slds-p-horizontal_small slds-p-top_medium">
                                <lightning-input-field field-name="Other_Type_of_Account__c" data-field="Other_Type_of_Account__c" autocomplete="off" label = "If Other, what Type of Account?" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}  ></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-input-field field-name="Current_Balance__c" data-field="Current_Balance__c" autocomplete="off" label = "Account Balance as of Today" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-input-field field-name="Name_of_Retirement_Bank__c" data-field="Name_of_Retirement_Bank__c" autocomplete="off" label = "Name of Institute Holding this Account" variant="label-stacked" class="custom-input icon-color" onchange={handleOnChange}></lightning-input-field>
                            </div>
							<template if:true={selectedRecordIdIsSet}> <!-- If the record Id exists, then we can attach files to it -->                            
                                <div class="upload-container slds-col slds-size_11-of-12 slds-p-around_large slds-m-bottom_medium">
                                    <div class="upload-header">
                                        <span>UPLOAD DOCUMENTS</span>
                                        <lightning-helptext content="Please upload the required documents." class="icon-color"></lightning-helptext>
                                    </div>
                                    <p class="upload-instructions">Please upload the following files:</p>
                                    <ul class="file-list">
                                        <li><strong>Six Months of Account Statements</strong></li>
                                    </ul>
                                        <div class="upload-box">
                                                <p class="file-types">JPG, PDF, CSV, DOCX, XLSX</p>
                                            <lightning-file-upload
                                                name="fileUploader"
                                                accept={acceptedFormats}
                                                record-id={selectedRecordId}
                                                multiple
                                                onuploadfinished={handleUploadFinished}
                                            >
                                            </lightning-file-upload>
                                        </div>               
                                    <template if:true={listOfUploadedRetirementFileNames}>
                                        <template for:each={listOfUploadedRetirementFileNames} for:item="file" for:index="index">
                                            <lightning-pill
                                            label={file.name}
                                            name={index} 
                                            key={file.id}
                                            data-id={file.id}
                                            data-field="uploadFile"
                                            onremove={handleFileDelete}>
                                        </lightning-pill>
                                        </template>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>

            </lightning-record-edit-form>
        </template>
        <div class="slds-col slds-size_1-of-1 controls slds-grid slds-grid_align-center slds-p-vertical_medium">
            <template if:true={addRetirementAccount}>
                <button class="next-button nextBtnPadding slds-m-top_xx-large" onclick={handleSave}>SAVE & CONTINUE
                    <span class="arrow nextBtnArrow">→</span>
                </button>
            </template>
        </div>
        <div class="slds-col slds-size_1-of-1 controls slds-grid slds-grid_align-center slds-p-vertical_medium">
            <template if:false={addRetirementAccount}>
                <button class="next-button nextBtnPadding slds-m-top_xx-large" onclick={handleSaveChild}>SUBMIT SECTION
                    <span class="arrow nextBtnArrow">→</span>
                </button>
            </template>
        </div>
    </div>
</template>
